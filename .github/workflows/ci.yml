name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  yarn-check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        directory: [
          'event',
          'service',
          'mc-app'
        ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '${{ matrix.directory }}/.nvmrc'
          cache: 'yarn'
          cache-dependency-path: ${{ matrix.directory }}/yarn.lock

      - name: Install dependencies
        run: yarn
        working-directory: ${{ matrix.directory }}

      - name: Build project
        run: yarn build
        working-directory: ${{ matrix.directory }}

      - name: Run tests
        run: yarn test
        working-directory: ${{ matrix.directory }}

      - name: Run audit
        working-directory: ${{ matrix.directory }}
        run: |
          set +e
          yarn audit
          code=$?
          set -e
          # yarn audit exits with a bitmask: 1=info 2=low 4=moderate 8=high 16=critical.
          # Fail on moderate or worse; tolerate info/low.
          if [ $((code & 28)) -ne 0 ]; then
            echo "::error::Moderate or higher vulnerabilities found (yarn audit exit $code)"
            exit 1
          fi
          echo "No moderate or higher vulnerabilities (yarn audit exit $code)"
